# nvim: filetype=hyprlang
monitorv2 {
	output = eDP-1 
	mode = preferred
	position = auto-right
	scale = 1.2
}

monitorv2 {
	output = HDMI-A-2
	mode = preferred
	position = auto-left
	scale = 1
	bitdepth=8
	cm = adobe
	# icc = $HOME/sRGB_IEC61966-2-1_black_scaled.icc
}
exec-once=dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP
exec-once=$HOME/.config/hypr/import-gsettings
exec-once=$HOME/start-hyprland.sh
exec-once=hyprctl setcursor Bibata-Modern-Classic 20
exec-once = wl-paste -p -t text --watch clipman store -P --histpath="~/.local/share/clipman-primary.json"
exec-once=$HOME/audio_output_hyprland.sh
exec-once=$HOME/start-wob.sh
# exec-once=obsidian --enable-features=UseOzonePlatform --ozone-platform=wayland

input {
    # kb_file=
    kb_layout=us,us,ma,fr
    kb_variant=dvp,,,
    # kb_model=
    kb_options=grp:rctrl_rshift_toggle,compose:ralt,caps:swapescape
    kb_rules=
	repeat_rate=40
	repeat_delay=150
	scroll_factor = 2

    follow_mouse=1

    accel_profile = flat
    force_no_accel=true # true for osu
    sensitivity=0.0 # -1.0 - 1.0, 0 means no modification.

    touchpad {
        natural_scroll=no
		tap-to-click=true
		disable_while_typing=true
    }

}

general {
    # main_mod=SUPER
    gaps_in=3
    gaps_out=3
    border_size=3
	

    col.active_border=0xFFb7bdf8
    # col.inactive_border=0xFFf0c6c6
    col.inactive_border=0xFF494d64
		# for use with borderangle animation
		# col.active_border = rgb(8aadf4) rgb(24273A) rgb(24273A) rgb(8aadf4) 45deg
		# col.inactive_border= rgb(24273A) rgb(24273A) rgb(24273A) rgb(24273A) 45deg
	layout = dwindle  # master|dwindle 
	# apply_sens_to_raw=1 # whether to apply the sensitivity to raw input (e.g. used by games where you aim using your mouse)
}

group {
    col.border_active=0xff89dceb 
    group_on_movetoworkspace = true
    # merge_floated_into_tiled_on_groupbar  = true
	# col.border_inactive=0xfff9e2b0
	groupbar {
		col.active=0xfff9e2b0
		gradients=false
		scrolling=false
	}
}


decoration {
	# multisample_edges = true
	# screen_shader = ~/.config/hypr/shaders/blue_light.glsl
	screen_shader = ~/.config/hypr/shaders/grayscale.glsl

    rounding=10
	blur {
		enabled=off
		size=3 # minimum 1
		passes=2 # minimum 1
	}
    # blur_new_optimizations=on
}
# this is the smooooothest bezier curve
animations {
    enabled=1

	bezier=easeInOutSine,0.37, 0, 0.63, 1
	bezier=easeInSine,0.12, 0, 0.39, 0
	bezier=easeOutSine,0.61, 1, 0.88, 1
	bezier = linear, 0.0, 0.0, 1.0, 1.0

    animation=windows,1,2,default
	animation=windowsIn,1,2,easeInSine,popin,60
	animation=windowsOut,1,2,easeOutSine,popin,60
    animation=fade,1,2,easeInOutSine
    animation=workspaces,1,2,easeInOutSine,slide



	# this kills my cpu
    # animation = border, 1, 50, easeInOutSine
    # animation = borderangle, 1, 100, linear, loop
}

dwindle {
    pseudotile=1 # enable pseudotiling on dwindle
	# no_gaps_when_only=false # No gaps when there is only one window on the workspace aka smart gaps. Was removed on 0.45.0
	force_split = 0 
	special_scale_factor = 0.8
	split_width_multiplier = 1.0 
	use_active_for_splits = true
	pseudotile = yes 
	preserve_split = yes 
}

gestures {
    # workspace_swipe=yes
    # workspace_swipe_fingers=3
	workspace_swipe_distance = 250
	workspace_swipe_invert = true
	workspace_swipe_min_speed_to_force = 15
	workspace_swipe_cancel_ratio = 0.5
	workspace_swipe_create_new = false
}

misc {
	vfr = true
	disable_hyprland_logo=true
	disable_splash_rendering=true
}


# VARIABLES
# $menu=bemenu
$browser=firefox
# $browser=zen-browser
$terminal=kitty
$terminal2=footclient

bind=SUPER,RETURN,exec,$terminal
bind=SUPERSHIFT,RETURN,exec,$terminal2
